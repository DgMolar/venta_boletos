<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bs Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/3b8c1bce5b.js"
      crossorigin="anonymous"
    ></script>
    <!-- Bootstrap 4.0.0 -->
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
    />
    <title>Admin</title>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a
          class="navbar-brand text-center mx-auto"
          href="#"
          style="font-size: 40px"
          >Boletos de Autobús</a
        >
      </div>
    </nav>
    <!-- Registrar -->
    <div class="container my-5">
      <div class="row bg-light">
        <div class="col-md-1 text-center pt-3">
          <a href="../../index.html"
            ><i class="bi bi-house-door text-dark"> INICIO</i></a
          >
        </div>

        <div class="col-md-6 mb-3 p-5">
          <div class="card">
            <div class="card-header text-dark text-center">
              <h4>Registrase</h4>
            </div>
            <div class="card-body">
              <!--FORMULARIO-->
              <form id="register-form">
                <!--USER-->
                <div class="form-group text-secondary">
                  <label for="user-register">Nombre de Usuario:</label>
                  <input
                    type="text"
                    class="form-control"
                    id="user-register"
                    placeholder="user_123"
                  />
                </div>
                <!--EMAIl-->
                <div class="form-group text-secondary">
                  <label for="email">Correo electrónico:</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email-register"
                    placeholder="user@gmail.com"
                  />
                </div>

                <!--FIRST PASSWORD-->
                <div class="form-group text-secondary">
                  <label for="password">Contraseña:</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password-first"
                    placeholder="Contraseña"
                  />
                </div>
                <!--CONFIRM PASSWORD-->
                <div class="form-group text-secondary">
                  <label for="password">Confirme Contraseña:</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password-confirm"
                    placeholder="Contraseña"
                  />
                </div>
                <div
                  id="validationErrors"
                  class="container text-danger text-center"
                ></div>
                <!--BOTON SUBMIT-->
                <div class="d-flex justify-content-center">
                  <button type="submit" class="btn btn-primary mt-4">
                    Registrar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="col-md-5 mb-3 p-5 text-center text-dark">
          <hr />
          <b><h1 class="h1">¡Bienvenido!</h1></b>
          <hr />
          <p>Registrate para poder tener acceso a la pagina web</p>
          <hr />
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
      <p>© 2023 Venta de Boletos de Autobús. Todos los derechos reservados.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
  </body>
</html>

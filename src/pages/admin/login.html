<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bs Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <!-- Bootstrap 4.0.0 -->
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
    />
    <title>Login Admins</title>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a
          class="navbar-brand text-center mx-auto"
          href="#"
          style="font-size: 40px"
          >Boletos de Autobús</a
        >
      </div>
    </nav>
    <!--LOGIN-->
    <div class="container my-5 border">
      <div class="row bg-light">
        <div class="col-md-1 text-center pt-3">
          <a href="../../index.html">
            <i class="bi bi-house-door text-dark"> INICIO</i>
          </a>
        </div>
        <div class="col-md-5 mb-3 p-5 text-center text-dark">
          <hr />
          <b>
            <h1 class="h1">¡Bienvenido administrador!</h1>
          </b>
          <hr />
          <p>Inicia sesión para poder ingresar al sitio web :)</p>
          <hr />
          <a class="navbar-brand" href="../../index.html">
            <img
              class="border rounded"
              src="../../images/logo.jpg"
              alt="Logo"
              height="200"
            />
          </a>
        </div>
        <div class="col-md-6 mb-3 p-5">
          <div class="card">
            <div class="card-header text-black text-center">
              <h4>Iniciar Sesión</h4>
            </div>
            <div class="card-body">
              <!-- FORMULARIO -->
              <form id="login-form" action="./login/login.php" method="POST">
                <!-- EMAIL -->
                <div class="form-group text-secondary">
                  <label for="email">Correo electrónico:</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email-login"
                    name="email-login"
                    placeholder="user@gmail.com"
                    autocomplete="username"
                  />
                </div>

                <!-- PASSWORD -->
                <div class="form-group text-secondary">
                  <label for="password">Contraseña:</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password-login"
                    name="password-login"
                    placeholder="password"
                    autocomplete="current-password"
                  />
                </div>

                <div
                  id="validationErrors"
                  class="container text-danger text-center"
                ></div>
                <!-- BOTÓN SUBMIT -->
                <div class="d-flex justify-content-center">
                  <button type="submit" class="btn btn-primary mt-4">
                    Iniciar sesión
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
      <p>
        © 2023 Central de Autobuses Ositos Viajeros. Todos los derechos
        reservados.
      </p>
    </footer>

    <!-- SCRIPTS -->
    <script src="./login/login.js"></script>
    <!-- Bootstrap 4.0.0 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
  </body>
</html>
